<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OrthoMate Goniometer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#0a0e14; --surface:#131820; --card:#1a2030; --border:#252d40;
    --green:#1a5c2a; --gb:#2db84a; --gg:rgba(45,184,74,.15);
    --orange:#e8711a; --blue:#3b8fe8; --text:#dde3ef; --muted:#6a7488;
  }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; }
  #app { min-height:100dvh; display:flex; flex-direction:column; max-width:640px; margin:0 auto;
    padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px); }
  .hdr { display:flex; align-items:center; justify-content:space-between; padding:14px 0 10px; border-bottom:1px solid var(--border); }
  .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:16px; }
  .logo span { color:var(--gb); }
  .conn { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); background:none; border:1px solid var(--border);
    border-radius:20px; padding:6px 12px; font-family:inherit; cursor:pointer; color:var(--text); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .dot.on { background:var(--gb); box-shadow:0 0 8px var(--gb); }
  .dot.err { background:var(--orange); }

  .steps { display:flex; gap:6px; padding:14px 0 6px; }
  .steps div { flex:1; height:4px; border-radius:2px; background:var(--border); }
  .steps div.done { background:var(--green); }
  .steps div.cur { background:var(--gb); }

  .screen { flex:1; display:flex; flex-direction:column; gap:14px; padding-top:10px; }
  .kicker { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
  h1 { font-family:'Syne',sans-serif; font-size:clamp(24px,6.5vw,32px); font-weight:800; line-height:1.15; }
  .hint { font-size:13px; line-height:1.6; color:#b6bfd0; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; }
  .hint b { color:#fff; font-weight:500; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opt { padding:16px 12px; border-radius:14px; border:1px solid var(--border); background:var(--surface); color:var(--text);
    font-family:'Syne',sans-serif; font-weight:700; font-size:17px; cursor:pointer; text-align:left; }
  .opt small { display:block; font-family:'DM Mono',monospace; font-weight:400; font-size:11px; color:var(--muted); margin-top:4px; }
  .opt.active { border-color:var(--gb); background:var(--gg); }

  .big { flex:1; min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .val { font-family:'Syne',sans-serif; font-weight:800; font-size:clamp(84px,28vw,140px); line-height:1; color:#fff;
    font-variant-numeric:tabular-nums; }
  .val sup { font-size:.35em; color:var(--gb); vertical-align:top; }
  .sub { font-size:13px; color:var(--muted); text-align:center; }
  .sub b { color:var(--text); font-weight:500; }
  .peak { font-size:15px; color:var(--orange); }

  .stab { width:100%; height:8px; border-radius:4px; background:var(--border); overflow:hidden; }
  .stab div { height:100%; width:0; background:var(--gb); transition:width .15s; }

  .btn { width:100%; padding:18px; border-radius:16px; border:none; font-family:'Syne',sans-serif; font-weight:800;
    font-size:18px; cursor:pointer; background:var(--green); color:#fff; box-shadow:0 4px 20px var(--gg); }
  .btn:active { transform:scale(.98); }
  .btn:disabled { opacity:.35; box-shadow:none; }
  .btn.orange { background:var(--orange); box-shadow:0 4px 20px rgba(232,113,26,.25); }
  .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--text); box-shadow:none; font-size:15px; padding:14px; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }

  .result { text-align:center; padding:18px 10px; background:var(--surface); border:1px solid var(--gb); border-radius:16px; }
  .nn { font-family:'Syne',sans-serif; font-weight:800; font-size:clamp(44px,13vw,64px); color:#fff; letter-spacing:1px; }
  .rlist { display:flex; flex-direction:column; gap:6px; }
  .ritem { display:flex; justify-content:space-between; font-size:13px; padding:10px 12px; background:var(--surface);
    border:1px solid var(--border); border-radius:10px; }
  .ritem b { color:#fff; font-weight:500; }

  .chips { display:flex; gap:6px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .chips .sub { margin-right:4px; }
  .chip { padding:7px 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--muted);
    font-family:'DM Mono',monospace; font-size:12px; cursor:pointer; }
  .chip.on { border-color:var(--gb); color:var(--gb); background:var(--gg); }
  details.cfg { font-size:11px; color:var(--muted); margin-top:16px; }
  details.cfg summary { cursor:pointer; padding:6px 0; }
  .cfg input { width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:8px 10px; font-family:inherit; font-size:11px; margin:6px 0; }
  .cfg pre { white-space:pre-wrap; word-break:break-all; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:8px; max-height:160px; overflow:auto; }
  .raw { display:flex; gap:12px; margin:6px 0; }
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="logo">Ortho<span>Mate</span> Gonio</div>
    <button class="conn" id="connBtn" onclick="toggleConnect()"><span id="connTxt">Sensor verbinden</span><span class="dot" id="connDot"></span></button>
  </div>
  <div class="steps" id="steps"><div></div><div></div><div></div><div></div><div></div></div>
  <div class="screen" id="screen"></div>

  <details class="cfg">
    <summary>Einstellungen &amp; Diagnose</summary>
    <div class="raw">Roll <b id="rX">–</b> Pitch <b id="rY">–</b> Yaw <b id="rZ">–</b></div>
    <input id="wsUrl" placeholder="ws://NAS-IP:8765?role=phone (optional Relay)" onchange="connectWS()">
    <pre id="log"></pre>
  </details>
</div>

<script src="gonio-ble.js?v=7"></script>
<script>
// ── Gelenk-Definitionen (Neutral-Null-Methode) ─────────────────────────────
const JOINTS = {
  OSG:   { name:'OSG',  a:'Dorsalextension', b:'Plantarflexion',
           place:'Sensor flach auf den <b>Fußrücken</b> (Mittelfuß) kleben/clippen. <b>Unterschenkel ruhig halten</b> – nur der Fuß bewegt sich.',
           neutral:'Fuß im rechten Winkel zum Unterschenkel (Neutral-Null).' },
  Knie:  { name:'Knie', a:'Extension', b:'Flexion',
           place:'Sensor <b>lateral am Unterschenkel</b> anlegen. <b>Oberschenkel fixieren</b> – nur der Unterschenkel bewegt sich.',
           neutral:'Knie gestreckt, Unterschenkel in Verlängerung des Oberschenkels.' },
  USG:   { name:'USG',  a:'Eversion', b:'Inversion',
           place:'Sensor <b>hinten auf den Calcaneus</b>. Bauchlage, <b>Unterschenkel ruhig halten</b>.',
           neutral:'Ferse in Verlängerung der Unterschenkelachse.' },
  Hüfte: { name:'Hüfte', a:'Extension', b:'Flexion',
           place:'Sensor <b>lateral am Oberschenkel</b>. <b>Becken fixieren</b>.',
           neutral:'Oberschenkel in Verlängerung des Rumpfes.' },
  Feder: { name:'Carbonfeder', title:'Carbonfeder', sub:'Auslenkung nach vorne', a:'Auslenkung', single:true,
           place:'Sensor <b>flach auf den Rücken der Feder</b> (hinten) kleben/clippen. <b>Feder unten fest einspannen</b> bzw. Fuß/Basis fixieren.',
           neutral:'Feder unbelastet in Ausgangsstellung, nicht berühren.' },
  OSGM:  { name:'OSG', title:'OSG + Knie', sub:'2–3 Sensoren, Knie live', a:'Dorsalextension', b:'Plantarflexion', multi:true },
  OSGK:  { name:'OSG', title:'OSG gestr./gebeugt', sub:'DE/PF Knie gestreckt + gebeugt', a:'Dorsalextension', b:'Plantarflexion', silf:true },
};

// ── Modus „OSG Knie gestreckt/gebeugt“ (absolut, ohne Augenmaß-Nullstellung) ─
// Der Sensor liegt immer FLACH SEITLICH (lateral) an: erst am Unterschenkel,
// dann an der Fußaußenkante. Der Winkel zwischen beiden Lagen in der Sagittalebene
// ergibt den echten OSG-Winkel: 0° = Fuß 90° zum Unterschenkel.
const KNEE = {
  ext:  { label:'Knie gestreckt', pos:'Rückenlage, Bein gestreckt, <b>Ferse frei über der Liegenkante</b>. Unterschenkel liegt auf und bleibt liegen.' },
  flex: { label:'Knie gebeugt',   pos:'Sitzend an der Liegenkante, <b>Knie ca. 90°</b>, Unterschenkel hängt senkrecht und bleibt ruhig.' },
};
const SV_PHASES = [['ext','shank'],['ext','de'],['ext','pf'],['flex','shank'],['flex','de'],['flex','pf'],[null,'res']];

// ── Zustand ────────────────────────────────────────────────────────────────
const S = {
  step:0, joint:null, side:null,
  g:null,           // geglätteter Schwerkraft-Vektor (Sensor-KS)
  ref:null,         // Referenz bei Nullstellung
  axis:null,        // Vorzeichen (+1/−1), damit Richtung A positiv ist
  axisMode:'auto',  // Messachse: 'auto' | 0 | 1 | 2  (Sensor-X/Y/Z)
  k:null,           // aktive Messachse (Index)
  proj:1,           // Anteil der Schwerkraft senkrecht zur Messachse (Messbarkeit)
  signed:0,         // aktueller Winkel relativ zur Nullstellung (+ = Richtung A)
  hist:[],          // [t, angle] für Ruhe-Erkennung
  peak:null,        // Extremwert im aktuellen Schritt
  A:null, B:null,
  results:[],
  sv:null,          // Knie-Modus: { i, shank:{ext,flex}, val:{ext:{de,pf}, flex:{de,pf}} }
  phi:0,            // Winkel des Sensors in seiner Ebene (Grad)
  flat:1,           // 1 = Sensor liegt sauber seitlich an
};

// ── Sensor-Daten → Winkel ──────────────────────────────────────────────────
// Roll/Pitch aus der Sensorfusion → Schwerkraft-Vektor. Yaw (driftet) wird ignoriert.
// Winkel = Abstand zwischen aktuellem und Referenz-Vektor → unabhängig davon,
// wie der Sensor ausgerichtet ist (keine Achsenwahl nötig).
function onAngles(a) {
  $('rX').textContent = a.X.toFixed(1); $('rY').textContent = a.Y.toFixed(1); $('rZ').textContent = a.Z.toFixed(1);
  // Schwerkraftrichtung bevorzugt aus der Rohbeschleunigung: kein Nachlaufen/Driften
  // der Sensorfusion nach Drehungen. Fallback: Roll/Pitch der Fusion.
  let v, src;
  if (a.acc && len(a.acc) > 0) { v = norm(a.acc); src = 'Beschleunigung'; }
  else {
    const r = a.X * Math.PI/180, p = a.Y * Math.PI/180;
    v = [-Math.sin(p), Math.sin(r)*Math.cos(p), Math.cos(r)*Math.cos(p)]; src = 'Fusion';
  }
  if (src !== S.src) { S.src = src; S.g = null; log('Winkelquelle: ' + src); }
  // Adaptive Glättung: in Ruhe stark (ruhige Anzeige), bei Bewegung schnell
  if (S.g) {
    const d = Math.acos(Math.max(-1, Math.min(1, dot(S.g, v)))) * 180/Math.PI;
    const k = Math.max(0.1, Math.min(0.6, d / 2));
    S.g = norm(S.g.map((x,i) => x + k*(v[i]-x)));
  } else S.g = v;

  S.phi = Math.atan2(S.g[1], S.g[0]) * 180/Math.PI;
  S.flat = Math.sqrt(Math.max(0, 1 - S.g[2]*S.g[2]));
  if (S.sv) return onAnglesSilf();

  // Nur die Drehung um EINE Sensor-Achse zählt. Verdrehen/seitliches Kippen
  // (Drehung um die anderen Achsen) wird herausgerechnet.
  let ang = 0;
  if (S.ref) {
    if (S.k == null && S.axisMode !== 'auto') S.k = S.axisMode;
    if (S.k == null) {
      const c = cross(S.ref, S.g);
      const total = Math.atan2(len(c), dot(S.ref, S.g)) * 180/Math.PI;
      if (S.step === 2 && total > 4) {                     // erste deutliche Bewegung → Achse einrasten
        const m = c.map(Math.abs); S.k = m.indexOf(Math.max(...m));
        log('Messachse eingerastet: ' + 'XYZ'[S.k]);
      } else ang = total;
    }
    if (S.k != null) {
      // Hebelachse l = die Achse, die bei Null am waagerechtesten liegt. Gemessen wird ihre
      // Neigungsänderung → Verdrehen um die Hebelachse selbst ändert den Wert nicht.
      const [i, j] = [[1,2],[2,0],[0,1]][S.k], a = S.ref, b = S.g;
      const l = Math.abs(a[i]) <= Math.abs(a[j]) ? i : j, m = l === i ? j : i;
      const s0 = Math.sign(a[m]) || 1;
      const elev = g => Math.atan2(g[l], s0 * (Math.sign(g[m]) || 1) * Math.sqrt(Math.max(0, 1 - g[l]*g[l])));
      ang = (elev(b) - elev(a)) * 180/Math.PI;
      ang = ((ang + 540) % 360) - 180;
      S.proj = Math.hypot(a[i], a[j]);
      if (!S.axis && S.step === 2 && Math.abs(ang) > 3) S.axis = Math.sign(ang);
      if (S.axis) ang *= S.axis;
    }
  }
  S.signed = ang;
  const now = performance.now();
  S.hist.push([now, ang]);
  while (S.hist.length && now - S.hist[0][0] > 1200) S.hist.shift();

  if (S.step === 2 && S.axis) S.peak = S.peak == null ? ang : Math.max(S.peak, ang);
  if (S.step === 3) S.peak = S.peak == null ? -ang : Math.max(S.peak, -ang);
  tick();
}
function onAnglesSilf() {
  const [knee, ph] = SV_PHASES[S.sv.i];
  let v = S.phi;
  if (ph === 'de' || ph === 'pf') {
    let d = S.phi - S.sv.shank[knee];
    d = ((d + 540) % 360) - 180;              // auf -180..180
    v = Math.abs(d) - 90;                     // + = Dorsalextension, − = Plantarflexion
    S.signed = v;
    if (ph === 'de') S.peak = S.peak == null ? v : Math.max(S.peak, v);
    else             S.peak = S.peak == null ? -v : Math.max(S.peak, -v);
  }
  const now = performance.now();
  S.hist.push([now, v]);
  while (S.hist.length && now - S.hist[0][0] > 1200) S.hist.shift();
  tick();
}
function svStart() { S.sv = { i:0, shank:{}, val:{ ext:{}, flex:{} } }; svGo(0); }
function svGo(i) { S.sv.i = i; S.peak = null; S.hist = []; S.signed = 0; render(); }
function svShank() {
  const knee = SV_PHASES[S.sv.i][0];
  S.sv.shank[knee] = S.phi;
  log(KNEE[knee].label + ': Unterschenkel erfasst (' + S.phi.toFixed(1) + '°)');
  svGo(S.sv.i + 1);
}
function svHold() {
  const [knee, ph] = SV_PHASES[S.sv.i];
  S.sv.val[knee][ph] = r0(S.peak ?? 0);
  svGo(S.sv.i + 1);
}
function svAccept(nextSideToo) {
  const v = S.sv.val, list = [];
  for (const k of ['ext','flex']) {
    const res = { type:'rom', joint:'OSG (' + KNEE[k].label + ')', side:S.side, motionA:'Dorsalextension', motionB:'Plantarflexion',
                  a:v[k].de, b:v[k].pf, notation:notation(v[k].de, v[k].pf), knee:k, ts:Date.now() };
    S.results = S.results.filter(r => !(r.joint === res.joint && r.side === res.side));
    S.results.push(res); list.push(res);
  }
  const msg = { type:'rom-silfverskiold', side:S.side, extended:list[0], flexed:list[1], deDiff:v.flex.de - v.ext.de, ts:Date.now() };
  window.dispatchEvent(new CustomEvent('gonioROM', { detail:msg }));
  try { if (parent !== window) parent.postMessage(msg, '*'); } catch(_) {}
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
  log('Übernommen: OSG ' + S.side + ' gestreckt ' + list[0].notation + ' / gebeugt ' + list[1].notation);
  S.sv = null;
  if (nextSideToo) { S.side = S.side === 'links' ? 'rechts' : 'links'; go(1); } else { S.joint = null; go(0); }
}
// ── Modus „OSG + Knie“ mit 2–3 Sensoren ───────────────────────────────────
// Alle Sensoren FLACH SEITLICH (lateral), markierte Kante zeigt nach distal
// (Oberschenkel → Knie, Unterschenkel → Fuß, Fuß → Zehen).
// Knie = Winkel Oberschenkel↔Unterschenkel, OSG = Winkel Unterschenkel↔Fuß − 90°.
// Der Unterschenkel darf sich bewegen – gemessen wird immer relativ.
const MS_SLOTS = {
  thigh: { label:'Oberschenkel', where:'lateral am Oberschenkel, Kante → Knie', optional:true },
  shank: { label:'Unterschenkel', where:'lateral am Unterschenkel, Kante → Fuß' },
  foot:  { label:'Fuß', where:'Fußaußenkante (Ferse → Kleinzehenballen), Kante → Zehen' },
};
const MS_PHASES = [[null,'assign'],[null,'zero'],[null,'cal'],['ext','de'],['ext','pf'],['flex','de'],['flex','pf'],[null,'res']];
const KNEE_TARGET = { ext:0, flex:90 }, KNEE_TOL = 7;
const KNEE_POS = {
  ext:  'Knie <b>gestreckt</b> (Ziel 0°). Rückenlage oder Langsitz.',
  flex: 'Knie <b>90° gebeugt</b>. Sitzend an der Liegenkante, Unterschenkel hängt.',
};

const MS_FILL = ['shank', 'foot', 'thigh'];      // Reihenfolge beim Verbinden (Rolle steht erst nach dem Bewegen fest)
function msStart() {
  const slots = {};
  for (const k of MS_FILL) {
    // Ist der Standard-Sensor schon verbunden, wird er übernommen.
    const dev = (k === 'shank' && GonioBLE.connected) ? GonioBLE : GonioBLE.create();
    slots[k] = { dev, g:null, phi:0, flat:1, src:null, last:0, motion:0, connected: dev.connected, status: dev.connected ? (dev.deviceName || 'Verbunden') : '' };
  }
  S.ms = { i:0, slots, kneeOff:0, val:{ ext:{}, flex:{} }, knee:null, osg:null, ident:null, identified:{} };
  for (const k of MS_FILL) bindSlot(k);
  msGo(0);
}
// Handler eines Sensors an seine aktuelle Rolle binden (nach Tausch neu aufrufen)
function bindSlot(k) {
  const s = S.ms.slots[k], dev = s.dev;
  dev.onAngles = a => msOnAngles(k, a);
  dev.onLog = m => log('Sensor ' + (dev.shortId ? dev.shortId() : '') + ': ' + m);
  dev.onStatus = (state, text) => {
    s.connected = state === 'on'; s.status = text;
    if (state !== 'on') { S.ms.identified = {}; S.ms.ident = null; }   // Zuordnung neu nötig
    render();
  };
}
function msConnectedKeys() { return MS_FILL.filter(k => S.ms.slots[k].connected); }
function msAdd() {                                 // nächsten freien Platz verbinden
  const k = MS_FILL.find(k => !S.ms.slots[k].connected);
  if (k) msConnect(k);
}
function msRemove(k) { const s = S.ms.slots[k]; S.ms.identified = {}; S.ms.ident = null; if (SIM) { s.connected = false; render(); } else s.dev.disconnect(); }

// ── Zuordnen durch Bewegen ──
function msIdentStart() {
  const n = msConnectedKeys().length;
  S.ms.identified = {};
  S.ms.ident = { order: n >= 3 ? ['shank','foot','thigh'] : ['shank','foot'], idx: 0, armed: false };
  render();
}
function msIdentCheck() {
  const m = S.ms, id = m.ident;
  if (!id || id.idx >= id.order.length) return;
  const cand = msConnectedKeys().filter(k => !Object.values(m.identified).includes(m.slots[k].dev));
  const mot = cand.map(k => m.slots[k].motion);
  if (!id.armed) { if (Math.max(0, ...msConnectedKeys().map(k => m.slots[k].motion)) < 6) { id.armed = true; render(); } return; }  // erst Ruhe abwarten
  const max = Math.max(...mot), iMax = mot.indexOf(max);
  const second = Math.max(0, ...mot.filter((_, i) => i !== iMax));
  if (max > 15 && max > 2.5 * second) {
    const role = id.order[id.idx], from = cand[iMax];
    if (from !== role) {                          // Sensor-Daten zwischen den Rollen tauschen
      const t = m.slots[role]; m.slots[role] = m.slots[from]; m.slots[from] = t;
      bindSlot(role); bindSlot(from);
    }
    m.identified[role] = m.slots[role].dev;
    log(MS_SLOTS[role].label + ' = Sensor ' + (m.slots[role].dev.shortId ? m.slots[role].dev.shortId() : ''));
    try { navigator.vibrate && navigator.vibrate(120); } catch(_) {}
    id.idx++; id.armed = false;
    render();
  }
}
function msIdentDone() { const id = S.ms.ident; return !!id && id.idx >= id.order.length; }
function msStop() {
  if (!S.ms) return;
  for (const s of Object.values(S.ms.slots)) {
    if (s.dev === GonioBLE) { GonioBLE.onAngles = onAngles; GonioBLE.onLog = log; GonioBLE.onStatus = mainStatus; }
    else if (s.dev.connected) s.dev.disconnect();
  }
  S.ms = null;
}
function msGo(i) { S.ms.i = i; S.peak = null; S.peakKnee = null; S.hist = []; render(); }

async function msConnect(k) {
  const s = S.ms.slots[k];
  if (SIM) {
    const used = MS_FILL.filter(o => S.ms.slots[o].connected).map(o => S.ms.slots[o].dev.simRole);
    s.dev.simRole = (window.simOrder || ['foot','thigh','shank']).find(r => !used.includes(r));   // absichtlich „falsch“ verbunden
    s.dev.deviceId = 'SIM-' + s.dev.simRole; s.dev.shortId = () => s.dev.simRole.slice(0,4).toUpperCase();
    s.connected = true; s.status = 'Sim-Sensor'; simMulti(); return render();
  }
  if (s.dev.connected) return s.dev.disconnect();
  if (s.busy) return;
  s.busy = true;

function gravityFrom(a) {

// Simulation: Oberschenkel/Unterschenkel/Fuß mit simKnee / simOsg / simTilt
function simMulti() {

    const Ry = [[Math.cos(b),0,Math.sin(b)],[0,1,0],[-Math.sin(b),0,Math.cos(b)]];

    const P = { thigh: pT, shank: pS, foot: pF };
    const shake = r => window.simShake === r ? (Math.random() - .5) * 60 : 0;
    for (const k of ['thigh','foot','shank']) {        // Unterschenkel zuletzt (löst Berechnung aus)
      const s = S.ms.slots[k]; if (!s.connected) continue;
      const r = s.dev.simRole, ph = (P[r] + shake(r)) * Math.PI/180, M = mount[r];
      const gs = [Math.cos(ph), Math.sin(ph), 0], gb = M.map(row => row[0]*gs[0] + row[1]*gs[1] + row[2]*gs[2]);
      msOnAngles(k, { X:0, Y:0, Z:0, acc: gb.map(x => (x + n()) * 2048) });
    }
  }, 50);
}

function stability() {             // 0..1  (1 = ruhig seit ≥1 s)
  if (S.hist.length < 3) return 0;
  const span = S.hist[S.hist.length-1][0] - S.hist[0][0];
  const vals = S.hist.map(h => h[1]);
  const range = Math.max(...vals) - Math.min(...vals);
  return Math.max(0, Math.min(1, span/1000)) * Math.max(0, 1 - range/3);
}
const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const len = a => Math.hypot(a[0],a[1],a[2]);
const norm = a => { const l = len(a) || 1; return a.map(x => x/l); };
const $ = id => document.getElementById(id);
const r0 = v => Math.round(v);

// ── Ablauf ─────────────────────────────────────────────────────────────────
function go(step) {
  S.step = step; S.peak = null; S.hist = [];
  if (step <= 1) { S.ref = null; S.axis = null; S.k = null; S.A = null; S.B = null; }
  if (step === 0) S.sv = null;
  if (step === 0) msStop();
  if (step === 1 && JOINTS[S.joint].silf) return svStart();
  if (step === 1 && JOINTS[S.joint].multi) return msStart();
  render();
}
function zero() {
  if (!S.g) return;
  S.ref = S.g.slice(); S.axis = null; S.k = null; S.hist = [];
  log('Nullstellung gesetzt');
  go(2);
}
function hold(which) {
  const v = r0(S.peak ?? 0);
  if (JOINTS[S.joint].single) { S.A = Math.round((S.peak ?? 0) * 10) / 10; S.B = null; return go(4); }
  if (which === 'A') { S.A = v; go(3); } else { S.B = v; go(4); }
}
function redo(which) { if (which === 'A') { S.axis = null; if (S.axisMode === 'auto') S.k = null; go(2); } else go(3); }
function setAxisMode(m) {
  S.axisMode = m; S.k = null; S.axis = null; S.peak = null; S.hist = [];
  if (S.step === 3) S.step = 2;          // Vorzeichen neu bestimmen
  render();
}
function axisChips() {
  const cur = ' <span id="axisNow">' + (S.k == null ? '' : 'XYZ'[S.k]) + '</span>';
  const b = (m, l) => `<button class="chip ${S.axisMode === m ? 'on' : ''}" onclick="setAxisMode(${m === 'auto' ? "'auto'" : m})">${l}</button>`;
  return `<div class="chips"><span class="sub">Messachse</span>${b('auto', 'Auto' + (S.axisMode === 'auto' ? cur : ''))}${b(0,'X')}${b(1,'Y')}${b(2,'Z')}</div>`;
}

// Neutral-Null-Notation: A–0–B, bei Defizit wandert die 0 nach außen
function notation(A, B) {
  if (A >= 0 && B >= 0) return `${A}-0-${B}`;
  if (A < 0) return `0-${-A}-${B}`;
  return `${A}-${-B}-0`;
}

function accept() {
  const j = JOINTS[S.joint];
  const res = j.single
    ? { type:'spring', joint:j.name, side:S.label || '', motionA:j.a, a:S.A, notation:S.A.toFixed(1) + '°', ts:Date.now() }
    : { type:'rom', joint:S.joint, side:S.side, motionA:j.a, motionB:j.b, a:S.A, b:S.B,
        notation:notation(S.A, S.B), ts:Date.now() };
  S.results = S.results.filter(r => !(r.joint === res.joint && r.side === res.side));
  S.results.push(res);
  window.dispatchEvent(new CustomEvent('gonioROM', { detail:res }));
  try { if (parent !== window) parent.postMessage(res, '*'); } catch(_) {}
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(res));
  log('Übernommen: ' + res.joint + ' ' + res.side + ' ' + res.notation);
  return res;
}
function nextSide() { accept(); S.side = S.side === 'links' ? 'rechts' : 'links'; go(1); }
function nextJoint() { accept(); S.joint = null; go(0); }
function nextSpring() { accept(); S.label = ''; go(0); }

// ── Darstellung ────────────────────────────────────────────────────────────
function stepBar(n, cur) {
  $('steps').innerHTML = Array.from({length:n}, (_, i) => `<div class="${i < cur ? 'done' : i === cur ? 'cur' : ''}"></div>`).join('');
}
function renderSilf() {
  const [knee, ph] = SV_PHASES[S.sv.i];
  stepBar(SV_PHASES.length + 1, S.sv.i + 1);
  const K = knee && KNEE[knee], back = S.sv.i === 0 ? 'go(0)' : `svGo(${S.sv.i - 1})`;
  const flatWarn = `<div class="sub" id="flatWarn" style="color:var(--orange)"></div>`;
  let h = '';
  if (ph === 'shank') {
    h = `<div class="kicker">OSG ${S.side} · ${K.label} · 1/3</div><h1>Unterschenkel erfassen</h1>
      <div class="hint">${K.pos}<br><br>Sensor <b>flach seitlich (lateral) an den Unterschenkel</b> halten, Längsachse entlang des Unterschenkels, eine <b>markierte Sensor-Kante zeigt Richtung Fuß</b>.</div>
      <div class="big"><div class="sub">Ruhig halten …</div><div class="stab" style="max-width:320px"><div id="stab"></div></div>
        <div class="sub" id="stabTxt"></div>${flatWarn}</div>
      <div class="row"><button class="btn ghost" onclick="${back}">← Zurück</button>
      <button class="btn" id="zeroBtn" onclick="svShank()">Unterschenkel erfassen</button></div>`;
  } else if (ph === 'de' || ph === 'pf') {
    const de = ph === 'de', m = de ? 'Dorsalextension' : 'Plantarflexion';
    h = `<div class="kicker">OSG ${S.side} · ${K.label} · ${de ? 2 : 3}/3</div><h1>${m}</h1>
      <div class="hint">${de ? `Sensor jetzt <b>flach an die Fußaußenkante</b> (Ferse → Kleinzehenballen), dieselbe Seite nach außen, die <b>markierte Kante zeigt jetzt Richtung Zehen</b>. Unterschenkel nicht bewegen.<br><br>Fuß passiv in <b>Dorsalextension</b> bis zum Anschlag drücken und halten.`
                             : `Fuß in <b>Plantarflexion</b> bis zum Anschlag bewegen und halten.`}</div>
      <div class="big"><div class="val" id="live">0<sup>°</sup></div>
        <div class="peak" id="peak">Max –</div>
        <div class="stab" style="max-width:320px"><div id="stab"></div></div>
        <div class="sub" id="stabTxt"></div>${flatWarn}</div>
      <div class="row"><button class="btn ghost" onclick="${back}">← Zurück</button>
      <button class="btn orange" id="holdBtn" onclick="svHold()">Festhalten</button></div>`;
  } else {
    const v = S.sv.val, diff = v.flex.de - v.ext.de;
    const row = k => `<div class="ritem"><span>${KNEE[k].label}</span><b>${notation(v[k].de, v[k].pf)}</b></div>`;
    h = `<div class="kicker">Ergebnis · OSG ${S.side}</div><h1>Knie gestreckt / gebeugt</h1>
      <div class="result"><div class="sub">Dorsalextension gestreckt <b>${v.ext.de}°</b> · gebeugt <b>${v.flex.de}°</b></div>
        <div class="nn">${diff > 0 ? '+' : ''}${diff}°</div><div class="sub">Zugewinn DE bei Kniebeugung</div></div>
      <div class="rlist">${row('ext')}${row('flex')}</div>
      <div class="hint">${diff >= 10 ? 'Deutlich mehr DE bei gebeugtem Knie → Hinweis auf <b>Verkürzung des M. gastrocnemius</b> (Silfverskiöld positiv).'
        : 'Kaum Unterschied → Einschränkung eher durch <b>M. soleus / Gelenk</b> (Silfverskiöld negativ).'}</div>
      <div class="row"><button class="btn ghost" onclick="svGo(0)">Gestreckt neu</button><button class="btn ghost" onclick="svGo(3)">Gebeugt neu</button></div>
      <div style="flex:1"></div>
      <button class="btn" onclick="svAccept(true)">Übernehmen → OSG ${S.side === 'links' ? 'rechts' : 'links'}</button>
      <button class="btn ghost" onclick="svAccept(false)">Übernehmen → anderes Gelenk</button>`;
  }
  $('screen').innerHTML = h;
  tick();
}
function render() {
  if (S.ms) return renderMulti();
  if (S.sv) return renderSilf();
  stepBar(5, S.step);
  const j = S.joint && JOINTS[S.joint];
  const connected = GonioBLE.connected || SIM;
  let h = '';

  if (S.step === 0) {
    h = `<div class="kicker">Schritt 1</div><h1>Was wird gemessen?</h1>
      <div class="grid">${Object.keys(JOINTS).map(k => `<button class="opt ${S.joint===k?'active':''}" onclick="selectJoint('${k}')">${JOINTS[k].title || k}<small>${JOINTS[k].sub || JOINTS[k].a + ' / ' + JOINTS[k].b}</small></button>`).join('')}</div>
      ${j && j.single
        ? `<input id="springLabel" class="opt" style="font-family:'DM Mono',monospace;font-size:14px;font-weight:400" placeholder="Bezeichnung (optional), z. B. Feder 3 / 4 mm" value="${(S.label||'').replace(/"/g,'&quot;')}" oninput="S.label=this.value">`
        : `<div class="grid">${['links','rechts'].map(s => `<button class="opt ${S.side===s?'active':''}" onclick="S.side='${s}';render()">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div>`}
      ${resultsHTML()}
      <div style="flex:1"></div>
      ${connected || (j && j.multi) ? '' : '<div class="hint">Zuerst oben rechts den <b>Sensor verbinden</b>.</div>'}
      <button class="btn" ${S.joint && (S.side || (j && j.single)) && (connected || (j && j.multi)) ? '' : 'disabled'} onclick="go(1)">Weiter →</button>`;
  }
  else if (S.step === 1) {
    h = `<div class="kicker">Schritt 2 · ${j.name} ${j.single ? (S.label||'') : S.side}</div><h1>Sensor anlegen &amp; nullen</h1>
      <div class="hint">${j.place}<br><br>${j.neutral}</div>
      <div class="big"><div class="sub">Ruhig halten …</div><div class="stab" style="max-width:320px"><div id="stab"></div></div>
        <div class="sub" id="stabTxt"></div></div>
      <div class="row"><button class="btn ghost" onclick="go(0)">← Zurück</button>
      <button class="btn" id="zeroBtn" onclick="zero()">Nullstellung setzen</button></div>`;
  }
  else if (S.step === 2 || S.step === 3) {
    const isA = S.step === 2, m = isA ? j.a : j.b;
    h = `<div class="kicker">Schritt ${S.step+1} · ${j.name} ${j.single ? (S.label||'') : S.side}</div><h1>${m}</h1>
      <div class="hint">${j.single ? `Feder langsam <b>nach vorne</b> bis zur gewünschten Last bzw. zum Anschlag drücken und kurz halten.`
                     : isA ? `Langsam in <b>${m}</b> bis zur Endstellung bewegen und kurz halten.`
                             : `Zurück über die Nullstellung in <b>${m}</b> bis zur Endstellung bewegen und kurz halten.`}</div>
      <div class="big"><div class="val" id="live">0<sup>°</sup></div>
        <div class="peak" id="peak">Max –</div>
        <div class="stab" style="max-width:320px"><div id="stab"></div></div>
        <div class="sub" id="stabTxt"></div><div class="sub" id="flatWarn" style="color:var(--orange)"></div></div>
      ${axisChips()}
      <div class="row"><button class="btn ghost" onclick="${isA ? 'go(1)' : "redo('A')"}">${isA ? '↺ Neu nullen' : '← ' + j.a}</button>
      <button class="btn orange" id="holdBtn" onclick="hold('${isA?'A':'B'}')">Festhalten</button></div>`;
  }
  else if (S.step === 4 && j.single) {
    h = `<div class="kicker">Ergebnis · ${j.name} ${S.label||''}</div><h1>Auslenkung nach vorne</h1>
      <div class="result"><div class="nn">${S.A.toFixed(1)}°</div><div class="sub">maximale Auslenkung gegenüber Nullstellung</div></div>
      <div class="hint">Feder loslassen – <b>Rückstellung</b> (sollte nahe 0° sein): <b id="ret">–</b></div>
      <div style="flex:1"></div>
      <button class="btn ghost" onclick="redo('A')">Nochmal messen (gleiche Null)</button>
      <button class="btn" onclick="nextSpring()">Übernehmen → nächste Messung</button>`;
  }
  else if (S.step === 4) {
    const n = notation(S.A, S.B);
    h = `<div class="kicker">Ergebnis · ${j.name} ${S.side}</div><h1>${j.a} / ${j.b}</h1>
      <div class="result"><div class="nn">${n}</div><div class="sub">${j.a} <b>${S.A}°</b> · ${j.b} <b>${S.B}°</b></div></div>
      <div class="row"><button class="btn ghost" onclick="redo('A')">${j.a} neu</button><button class="btn ghost" onclick="redo('B')">${j.b} neu</button></div>
      <div style="flex:1"></div>
      <button class="btn" onclick="nextSide()">Übernehmen → ${j.name} ${S.side === 'links' ? 'rechts' : 'links'}</button>
      <button class="btn ghost" onclick="nextJoint()">Übernehmen → anderes Gelenk</button>`;
  }
  $('screen').innerHTML = h;
  tick();
}
function resultsHTML() {
  if (!S.results.length) return '';
  return `<div class="kicker" style="margin-top:6px">Gemessen</div><div class="rlist">${S.results.map(r =>
    `<div class="ritem"><span>${r.joint} ${r.side}</span><b>${r.notation}</b></div>`).join('')}</div>`;
}
function tick() {                     // nur Live-Werte aktualisieren
  if (S.ms) return;
  const st = stability();
  if ($('stab')) $('stab').style.width = (st*100) + '%';
  if ($('stabTxt')) $('stabTxt').textContent = !S.g ? 'Keine Sensordaten' : st > 0.8 ? 'Stabil ✓' : 'Bewegung erkannt';
  if ($('zeroBtn')) $('zeroBtn').disabled = !S.g;
  if ($('flatWarn')) $('flatWarn').textContent = S.sv
    ? (S.g && S.flat < 0.8 ? '⚠ Sensor liegt nicht flach seitlich an – Werte ungenau' : '')
    : (S.k != null && S.proj < 0.35 ? '⚠ Messachse steht fast senkrecht – Sensor anders anlegen oder Achse wechseln' : '');
  if ($('axisNow') && S.k != null) $('axisNow').textContent = 'XYZ'[S.k];
  if ($('ret')) $('ret').textContent = (S.axis ? S.signed : Math.abs(S.signed)).toFixed(1) + '°';
  if ($('live')) {
    let v;
    if (S.sv) v = SV_PHASES[S.sv.i][1] === 'pf' ? -S.signed : S.signed;
    else { v = S.step === 3 ? -S.signed : S.signed; if (!S.axis) v = Math.abs(v); }
    const dec = S.joint && JOINTS[S.joint].single ? 1 : 0;
    $('live').innerHTML = v.toFixed(dec) + '<sup>°</sup>';
    $('peak').textContent = 'Max ' + (S.peak == null ? '–' : S.peak.toFixed(dec) + '°');
    $('holdBtn').disabled = S.peak == null;
  }
}

// ── Verbindung ─────────────────────────────────────────────────────────────
GonioBLE.onAngles = onAngles;
GonioBLE.onLog = log;
function mainStatus(state, text) {
  $('connDot').className = 'dot' + (state === 'on' ? ' on' : state === 'err' ? ' err' : '');
  $('connTxt').textContent = state === 'on' ? text : state === 'idle' ? 'Sensor verbinden' : text;
  if (state === 'err' && !GonioBLE.connected) S.g = null;
  render();
}
GonioBLE.onStatus = mainStatus;
// Gelenk/Option antippen: Auswahl setzen und – falls noch kein Sensor verbunden ist –
// direkt das Bluetooth-Fenster öffnen (muss synchron im Tipp passieren).
function selectJoint(k) {
  S.joint = k; render();
  if (!JOINTS[k].multi && !GonioBLE.connected && !SIM && GonioBLE.platform() !== 'none') toggleConnect();
}
async function toggleConnect() {
  if (GonioBLE.connected) return GonioBLE.disconnect();
  if (S.connecting) return;
  S.connecting = true;
  try { await GonioBLE.connect(); } catch (e) { log('Abbruch: ' + (e && e.message || e)); }
  finally { S.connecting = false; }
}
function log(m) { const el = $('log'); el.textContent += new Date().toLocaleTimeString('de-DE') + '  ' + m + '\n'; el.scrollTop = el.scrollHeight; }

let ws = null;
function connectWS() {
  const url = $('wsUrl').value.trim();
  try { localStorage.setItem('gonioWsUrl', url); } catch(_) {}
  if (ws) ws.close(); if (!url) return;
  ws = new WebSocket(url);
  ws.onopen = () => log('Relay verbunden'); ws.onclose = () => log('Relay getrennt');
}
try { const u = localStorage.getItem('gonioWsUrl'); if (u) { $('wsUrl').value = u; connectWS(); } } catch(_) {}

log('Plattform: ' + GonioBLE.platform() + ' · ' + (window.self !== window.top ? 'im iframe' : 'eigenes Fenster'));
if (GonioBLE.platform() === 'none' && !SIM) { $('connTxt').textContent = 'Kein Bluetooth'; $('connDot').className = 'dot err'; log(GonioBLE.noBleHint()); }

// ── Simulation (?sim=1) zum Testen ohne Sensor ─────────────────────────────
var SIM = /[?&]sim=1/.test(location.search);
if (SIM) {
  $('connTxt').textContent = 'Simulation'; $('connDot').className = 'dot on';
  window.simTarget = 0;  let cur = 0;
  setInterval(() => {
    cur += (simTarget - cur) * 0.15;
    const noise = () => (Math.random() - .5) * 3;   // ±1.5° Rauschen
    onAngles({ X: (window.simRoll ?? 12) + (window.simTwist ?? 0) + noise(), Y: -8 + cur + noise(), Z: 40 + noise()*3 });
  }, 100);
}
render();
</script>
</body>
</html>
