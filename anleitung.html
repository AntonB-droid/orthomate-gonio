<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gonio einrichten</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root { --bg:#0a0e14; --surface:#131820; --border:#252d40; --green:#1a5c2a; --gb:#2db84a; --gg:rgba(45,184,74,.15);
          --blue:#2f7fe6; --orange:#e8711a; --text:#dde3ef; --muted:#8892a6; }
  html, body { background:var(--bg); color:var(--text); font-family:'Syne',-apple-system,sans-serif; }
  #app { min-height:100dvh; max-width:560px; margin:0 auto; display:flex; flex-direction:column;
         padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px); }
  .top { display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:15px; }
  .top span { color:var(--gb); }
  .dots { display:flex; gap:6px; margin:16px 0 4px; }
  .dots i { flex:1; height:6px; border-radius:3px; background:var(--border); }
  .dots i.on { background:var(--gb); }
  .step { flex:1; display:flex; flex-direction:column; gap:18px; padding-top:18px; }
  .num { font-family:'DM Mono',monospace; font-size:13px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
  h1 { font-size:clamp(30px,9vw,40px); line-height:1.1; font-weight:800; }
  p.say { font-family:-apple-system,sans-serif; font-size:21px; line-height:1.45; color:#c9d1e0; }
  p.say b { color:#fff; }
  .pic { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:22px; display:flex;
         flex-direction:column; align-items:center; gap:12px; }
  .pic svg { max-width:100%; }
  .tap { position:relative; }
  .tap::after { content:''; position:absolute; right:-14px; bottom:-14px; width:34px; height:34px; border-radius:50%;
                background:rgba(232,113,26,.85); box-shadow:0 0 0 8px rgba(232,113,26,.25); animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { transform:scale(.8); box-shadow:0 0 0 14px rgba(232,113,26,.1); } }
  .fake { font-family:-apple-system,sans-serif; display:flex; align-items:center; gap:10px; }
  .appicon { width:74px; height:74px; border-radius:18px; background:linear-gradient(145deg,#3b8fe8,#1f5fbf);
             display:flex; align-items:center; justify-content:center; }
  .bar { width:100%; background:#2a2d33; border-radius:16px; padding:14px 16px; color:#fff; font-size:17px;
         display:flex; align-items:center; justify-content:space-between; font-family:-apple-system,sans-serif; }
  .pill { background:#3a3d44; color:#fff; border-radius:10px; padding:10px 16px; font-size:17px; font-family:-apple-system,sans-serif; }
  .spacer { flex:1; }
  .btn { display:block; width:100%; text-align:center; text-decoration:none; padding:22px; border-radius:20px; border:none;
         font-family:'Syne',sans-serif; font-weight:800; font-size:22px; cursor:pointer; color:#fff; background:var(--green);
         box-shadow:0 6px 24px var(--gg); }
  .btn.blue { background:var(--blue); box-shadow:0 6px 24px rgba(47,127,230,.3); }
  .btn.ghost { background:transparent; border:1px solid var(--border); box-shadow:none; font-size:17px; padding:16px; color:var(--muted); }
  .btn:active { transform:scale(.98); }
  .ok { color:var(--gb); font-size:20px; text-align:center; font-family:-apple-system,sans-serif; min-height:26px; }
  .small { font-family:-apple-system,sans-serif; font-size:15px; color:var(--muted); line-height:1.5; text-align:center; }
  .qr { background:#fff; border-radius:16px; padding:14px; width:260px; }
  .qr svg { width:100%; height:auto; display:block; }
</style>
</head>
<body>
<div id="app">
  <div class="top"><div>Ortho<span>Mate</span> Gonio</div><div class="num" id="cnt"></div></div>
  <div class="dots" id="dots"></div>
  <div class="step" id="step"></div>
</div>

}
function render() {

}
function next() { if (i < list.length - 1) { i++; render(); } }

async function copyLink(again) {
  let ok = false;
  try { await navigator.clipboard.writeText(GUIDE_URL); ok = true; }
  catch (_) {
    const t = document.createElement('textarea'); t.value = GUIDE_URL; t.setAttribute('readonly', '');

    t.select(); t.setSelectionRange(0, 99999);
    try { ok = document.execCommand('copy'); } catch (_) {}
    t.remove();
  }
  if (!again && ok) { next(); }
  const el = document.getElementById('copyOk');
  if (el) el.textContent = ok ? '✓ Gemerkt!' : 'Hat nicht geklappt – bitte nochmal tippen.';
}
